services:
  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hamsir_admin
      POSTGRES_DB: hamsir_crm_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      HAMSIR_APP_PASSWORD: ${HAMSIR_APP_PASSWORD:-}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/scripts/compose-postgres.sh:/docker-entrypoint-initdb.d/20-hamsir.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hamsir_admin", "-d", "hamsir_crm_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
  redisdata:
